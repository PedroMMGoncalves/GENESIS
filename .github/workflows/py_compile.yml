name: py_compile

# Catches the class of syntax error that would otherwise only surface
# when a user opens the .pyt in ArcGIS Pro. The .pyt file is valid
# Python and py_compile does NOT execute the module's imports
# (arcpy is unavailable on a CI runner), so this works without an
# ArcGIS license. Adapt the matrix if Pro's bundled Python version
# changes (currently 3.11 on Pro 3.3+).

on:
  push:
    branches: [main]
    paths:
      - "genesis_toolbox.pyt"
      - ".github/workflows/py_compile.yml"
  pull_request:
    paths:
      - "genesis_toolbox.pyt"

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: py_compile genesis_toolbox.pyt
        run: |
          python -m py_compile genesis_toolbox.pyt
          echo "py_compile OK on Python ${{ matrix.python-version }}"
